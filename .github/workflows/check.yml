name: Review candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python scripts/audit_release.py --index --objects --self-test
      - run: .\gradlew.bat --no-daemon :core:test :desktop:build :desktop:installDist
      - run: python scripts/audit_release.py --distribution desktop/build/install/ViviMe-Desktop-Pet
      - name: Compile Windows preview launcher and stage ZIP
        shell: pwsh
        run: .\scripts\windows-preview\Build-Preview.ps1 -OutputDirectory "$env:RUNNER_TEMP\vivime-preview"
      - name: Check generated archives
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath desktop/build/distributions -File)
          if ($archives.Count -ne 2) { throw 'Expected the demo ZIP and TAR' }
          foreach ($archive in $archives) {
            python scripts/audit_release.py --distribution $archive.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
