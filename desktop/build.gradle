plugins { id 'application' }

dependencies { implementation project(':core') }

application {
    mainClass = 'cn.harryh.vivime.demo.DesktopDemo'
    applicationName = 'ViviMe-Desktop-Pet'
}

distributions {
    main {
        distributionBaseName = 'ViviMe-Desktop-Pet'
        contents {
            from(rootProject.file('LICENSE'))
            from(rootProject.file('NOTICE.md'))
            from(rootProject.file('THIRD_PARTY_LICENSES.md'))
            from(rootProject.file('licenses')) { into 'licenses' }
        }
    }
}

tasks.register('verifyRuntimeBoundary') {
    doLast {
        def external = configurations.runtimeClasspath.incoming.resolutionResult.allComponents
            .collect { it.id }
            .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            .collect { "${it.group}:${it.module}:${it.version}".toString() }.toSet()
        if (external != ['com.alibaba.fastjson2:fastjson2:2.0.60'] as Set) {
            throw new GradleException("Unexpected runtime components: " + external)
        }
    }
}

tasks.named('check') { dependsOn 'verifyRuntimeBoundary' }
